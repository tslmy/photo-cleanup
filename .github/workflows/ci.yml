name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Run tests with coverage
        # The tests only need numpy: the ML/macOS-only dependencies (torch, pyobjc, ...) are
        # imported lazily and never touched, so skip installing them.
        run: >
          uv run --no-project --python ${{ matrix.python-version }}
          --with numpy --with pytest --with pytest-cov
          pytest --cov --cov-report=xml --cov-report=term-missing
      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@v5
        with:
          files: coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
